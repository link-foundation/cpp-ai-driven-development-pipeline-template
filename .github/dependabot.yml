# Keeps the action versions of .github/workflows and the pinned CI tools of
# scripts/requirements-ci.txt current. Each update is an ordinary pull request
# that runs the whole pipeline before it can merge. The cooldown waits a week
# after a release before proposing it, so a compromised release is usually
# found and yanked before it reaches the pipeline.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ['*']

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ['*']

  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
    # This monthly tag predates our baseline and would downgrade vcpkg-tool.
    # Keep newer monthly releases eligible while upstream fixes ancestry checks.
    ignore:
      - dependency-name: github.com/microsoft/vcpkg
        versions: ['<=2026.10.16']
    groups:
      native:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      secret-scanner:
        patterns: ['*']

  # global.json pins the SDK used for native NuGet packaging. There are no
  # managed projects or NuGet dependency manifests requiring a nuget entry.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
