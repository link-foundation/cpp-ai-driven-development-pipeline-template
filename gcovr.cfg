# gcovr settings used by the CI coverage job and locally:
#   cmake --preset coverage && cmake --build --preset coverage && ctest --preset coverage
#   gcovr --object-directory build/coverage
# Paths are relative to this file, so it also works from cpp/ in a
# multi-language repository.
root = .
filter = include/
exclude-throw-branches = yes
print-summary = yes
txt = -
xml = build/coverage/coverage.xml
fail-under-line = 90
